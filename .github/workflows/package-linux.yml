name: Package Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-packages:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          python -m pip install -r backend/requirements-build.txt
          npm ci

      - name: Test backend
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v

      - name: Build production sidecar
        run: python scripts/build_sidecar.py

      - name: Build Linux application
        run: npm run tauri -- build --bundles appimage

      - name: Create system-WebKit portable bundle
        run: |
          mkdir -p dist-portable/LocalForgeAI-v2
          install -m 755 src-tauri/target/release/localforge-ai-v2 dist-portable/LocalForgeAI-v2/localforge-ai-v2
          install -m 755 src-tauri/binaries/localforge-backend-x86_64-unknown-linux-gnu dist-portable/LocalForgeAI-v2/localforge-backend
          tar -C dist-portable -czf dist-portable/LocalForge-AI-v2-linux-x86_64-native.tar.gz LocalForgeAI-v2

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalForge-AI-v2-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            dist-portable/LocalForge-AI-v2-linux-x86_64-native.tar.gz
          if-no-files-found: error
          retention-days: 30
